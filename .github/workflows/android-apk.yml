
name: Inspect and Build Gemini APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Inspect project files
        run: |
          echo "Current directory:"
          pwd

          echo "Root files:"
          ls -la

          echo "Gradle wrapper files:"
          find . -type f \( \
            -name "gradlew" -o \
            -name "gradlew.bat" -o \
            -name "gradle-wrapper.properties" \
          \) -print

          echo "Gradle build files:"
          find . -maxdepth 5 -type f \( \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print

          echo "Android manifests:"
          find . -type f -name "AndroidManifest.xml" -print
