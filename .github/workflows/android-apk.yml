name: Build Gemini Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Generate missing Gradle Wrapper
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle Wrapper already exists."
            exit 0
          fi

          echo "Gradle Wrapper script is missing. Generating it..."

          DIST_URL=$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties \
            | head -n 1 | cut -d '=' -f 2- | sed 's/\\:/:/g')

          if [ -z "$DIST_URL" ]; then
            echo "ERROR: distributionUrl is missing."
            exit 1
          fi

          GRADLE_VERSION=$(basename "$DIST_URL" \
            | sed -E 's/^gradle-([0-9][0-9.]*)-(bin|all)\.zip$/\1/')

          if [ -z "$GRADLE_VERSION" ] || [ "$GRADLE_VERSION" = "$(basename "$DIST_URL")" ]; then
            echo "ERROR: Could not determine Gradle version from $DIST_URL"
            exit 1
          fi

          echo "Gradle version: $GRADLE_VERSION"

          curl -fL "$DIST_URL" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

          "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" \
            wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          chmod +x ./gradlew

          test -f ./gradle/wrapper/gradle-wrapper.jar
          test -f ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
